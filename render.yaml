services:
  - type: web
    name: slotsync-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_ENGINE
        value: "mysql"
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://slotsync.vercel.app"
      - key: DEMO_MODE
        value: "true"
      - key: DB_NAME
        value: "booking_db"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
