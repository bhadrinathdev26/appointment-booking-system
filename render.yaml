services:
  - type: web
    name: slotsync-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_ENGINE
        value: "mysql"
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://slotsync.vercel.app"
      - key: DEMO_MODE
        value: "true"
